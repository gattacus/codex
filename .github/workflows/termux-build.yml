name: Termux Android build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target and build dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup target add --toolchain 1.99.1 aarch64-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler libclang-dev
      - name: Configure Android NDK
        run: |
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ln -s "$TOOLCHAIN/llvm-ranlib" "$RUNNER_TEMP/aarch64-linux-android-ranlib"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            codex-rs/target
          key: termux-build-${{ runner.os }}-com.termux-${{ github.run_id }}
          restore-keys: termux-build-${{ runner.os }}-com.termux-
      - name: Test Termux installer
        run: python3 ../scripts/termux/test_install.py
      - name: Test custom remote name on Linux
        run: bash ../scripts/termux/cargo.sh test -p codex-app-server-transport --lib custom_name
      - name: Test Unix socket security on Linux
        run: bash ../scripts/termux/cargo.sh test -p codex-uds --profile dev-small
      - name: Test app socket status and Termux package selection
        run: |
          bash ../scripts/termux/cargo.sh test -p codex-app-server-daemon --lib status_returns_initial_snapshot_without_enabling_remote_control --profile dev-small
          bash ../scripts/termux/cargo.sh test -p codex-utils-home-dir --lib termux::tests --profile dev-small
      - name: Build Android CLI and device tests
        env:
          CODEX_TERMUX_APP_PACKAGE: com.termux
        run: |
          bash ../scripts/termux/cargo.sh build -p codex-cli --bin codex --target aarch64-linux-android --profile dev-small
          bash ../scripts/termux/cargo.sh test -p codex-uds --target aarch64-linux-android --profile dev-small --no-run
      - name: Package CLI with installer and instructions
        run: |
          mkdir -p ../termux-dist/tests
          cp target/aarch64-linux-android/dev-small/codex ../termux-dist/codex
          cp ../scripts/termux/install.sh ../termux-dist/install.sh
          cp ../TERMUX.md ../termux-dist/README.md
          find target/aarch64-linux-android/dev-small/deps -maxdepth 1 -name 'codex_uds-*' -type f -executable -exec cp {} ../termux-dist/tests/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: codex-termux-aarch64
          path: termux-dist/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            codex-rs/target
          key: termux-build-${{ runner.os }}-com.termux-${{ github.run_id }}
